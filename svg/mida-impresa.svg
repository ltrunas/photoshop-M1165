<svg xmlns='http://www.w3.org/2000/svg' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' viewBox='0 0 760 380' role='img' aria-label='Els mateixos píxels ocupen menys paper a 300 ppi' font-size='13'>
<text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Els mateixos píxels, més petits al paper com més ppi</text>
<rect x='60' y='60' width='228.60000000000002' height='285.6' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/>
<text x='174.3' y='196.8' text-anchor='middle' font-size='20' font-weight='700' fill='#1f2328'>72 ppi</text>
<text x='174.3' y='218.8' text-anchor='middle' fill='#5b6470'>38,1 × 47,6 cm</text>
<rect x='360' y='60' width='54.599999999999994' height='68.4' fill='#e0623a' fill-opacity='0.14' stroke='#e0623a' stroke-width='2'/>
<text x='387.3' y='100.2' text-anchor='middle' font-size='16' font-weight='700' fill='#1f2328'>300</text>
<text x='387.3' y='150.4' text-anchor='middle' font-weight='600' fill='#1f2328'>300 ppi</text>
<text x='387.3' y='168.4' text-anchor='middle' fill='#5b6470'>9,1 × 11,4 cm</text>
<text x='480' y='140' font-weight='600' fill='#1f2328'>Una imatge de 1080 × 1350 píxels</text>
<text x='480' y='162' fill='#5b6470' font-size='11.5'>Tots dos rectangles tenen els mateixos píxels.</text>
<text x='480' y='180' fill='#5b6470' font-size='11.5'>Només canvia quant espai ocupen al paper.</text>
<text x='24' y='360' font-size='11.5' fill='#5b6470'>Dibuix a escala: els dos rectangles mantenen la proporció real entre 38,1 × 47,6 cm i 9,1 × 11,4 cm.</text>
</svg>