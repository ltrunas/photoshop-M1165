<svg xmlns='http://www.w3.org/2000/svg' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' viewBox='0 0 760 360' role='img' aria-label='Les capes són fulls transparents apilats' font-size='13'>
<text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Les capes són fulls transparents apilats</text>
<g transform='translate(70,70)'>
<polygon points='40,0 300,0 260,70 0,70' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='150' y='42' text-anchor='middle' font-size='22' font-weight='700' fill='#1f2328'>Text</text>
<polygon points='40,95 300,95 260,165 0,165' fill='#e0623a' fill-opacity='0.14' stroke='#e0623a' stroke-width='2'/><circle cx='150' cy='130' r='20' fill='#e0623a' fill-opacity='0.5'/><rect x='140' y='122' width='20' height='16' fill='none'/>
<polygon points='40,190 300,190 260,260 0,260' fill='#f0efea' stroke='#8a8f98' stroke-width='1.5'/><text x='150' y='232' text-anchor='middle' fill='#5b6470'>Fondo (bloquejat)</text>
</g>
<g font-size='13' fill='#1f2328'>
<text x='430' y='112' font-weight='600'>Capa de texto</text><text x='430' y='131' fill='#5b6470' font-size='11.5'>Es veu per davant de tot</text>
<text x='430' y='207' font-weight='600'>Capa normal (la foto)</text><text x='430' y='226' fill='#5b6470' font-size='11.5'>Al mig: tapa el que té a sota</text>
<text x='430' y='302' font-weight='600'>Fondo</text><text x='430' y='321' fill='#5b6470' font-size='11.5'>La capa de sota de tot, amb candau</text>
</g>
<path d='M380 112H420M380 207H420M380 302H420' stroke='#8a8f98' stroke-width='1.25' fill='none'/>
</svg>