<svg xmlns='http://www.w3.org/2000/svg' font-family='system-ui,-apple-system,Segoe UI,Roboto,sans-serif' viewBox='0 0 760 300' role='img' aria-label='Alpha: de negre a blanc' font-size='13'>
<defs><linearGradient id='gs' x1='0' x2='1'><stop offset='0' stop-color='#000'/><stop offset='1' stop-color='#fff'/></linearGradient>
<pattern id='ck2' width='12' height='12' patternUnits='userSpaceOnUse'><rect width='12' height='12' fill='#fff'/><rect width='6' height='6' fill='#d9dce1'/><rect x='6' y='6' width='6' height='6' fill='#d9dce1'/></pattern></defs>
<text x='24' y='30' font-size='15' font-weight='600' fill='#1f2328'>Alpha (α): la transparència representada en escala de grisos</text>
<rect x='60' y='60' width='640' height='56' rx='6' fill='url(#gs)' stroke='#8a8f98'/>
<g stroke='#1f2328' stroke-width='1.5'><line x1='60' y1='116' x2='60' y2='130'/><line x1='380' y1='116' x2='380' y2='130'/><line x1='700' y1='116' x2='700' y2='130'/></g>
<g text-anchor='middle' fill='#1f2328' font-weight='600'><text x='60' y='148'>Negre</text><text x='380' y='148'>Gris</text><text x='700' y='148'>Blanc</text></g>
<g text-anchor='middle' fill='#5b6470' font-size='12'><text x='60' y='166'>0 %</text><text x='380' y='166'>50 %</text><text x='700' y='166'>100 %</text></g>
<g transform='translate(60,205)'><rect x='-30' y='-22' width='60' height='44' rx='5' fill='url(#ck2)' stroke='#8a8f98'/>
<ellipse cx='0' cy='0' rx='20' ry='11' fill='none' stroke='#1f2328' stroke-width='2'/><circle cx='0' cy='0' r='5' fill='#1f2328'/><line x1='-24' y1='16' x2='24' y2='-16' stroke='#d33' stroke-width='3'/></g>
<g transform='translate(380,205)'><rect x='-30' y='-22' width='60' height='44' rx='5' fill='url(#ck2)' stroke='#8a8f98'/><rect x='-30' y='-22' width='60' height='44' rx='5' fill='#e0623a' fill-opacity='0.5'/>
<ellipse cx='0' cy='0' rx='20' ry='11' fill='none' stroke='#1f2328' stroke-width='2' stroke-dasharray='4 3'/><circle cx='0' cy='0' r='5' fill='#1f2328' fill-opacity='0.5'/></g>
<g transform='translate(700,205)'><rect x='-30' y='-22' width='60' height='44' rx='5' fill='#e0623a'/>
