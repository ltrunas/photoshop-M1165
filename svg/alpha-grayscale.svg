<g text-anchor='middle' fill='#1f2328'><text x='60' y='248'>Amagat</text><text x='380' y='248'>Es veu a mitges</text><text x='700' y='248'>Es veu del tot</text></g>
<text x='380' y='284' text-anchor='middle' fill='#5b6470' font-size='12'>Aquest canal en blanc i negre és el canal alfa. Una màscara de capa n'és un.</text>
